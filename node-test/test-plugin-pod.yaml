# test-plugin-pod.yaml -- TIER 1 test consumer.
#
# A minimal pod that mimics exactly what the scheduler WILL do after the Part B
# patch: it pulls node identity from the wes-identity ConfigMap via `envFrom`
# (Optional), then runs the pywaggle2 reader and prints the resolved NodeInfo.
#
# This proves the ConfigMap->env->pywaggle2 chain on a real node WITHOUT needing the
# patched scheduler. The pywaggle2 reader is inlined (kept byte-identical to
# pywaggle2/node_info_env.py) so the pod is self-contained -- no image build.
#
# NOTE: carries the sagecontinuum.org plugin labels so it looks like a plugin pod,
# but sets envFrom itself (Tier 1). In Tier 2 the scheduler injects envFrom instead.
apiVersion: v1
kind: Pod
metadata:
  name: wes-nodeinfo-test
  labels:
    sagecontinuum.org/role: plugin
    app: wes-nodeinfo-test
spec:
  restartPolicy: Never
  containers:
    - name: reader
      image: docker.io/library/python:3.12-slim
      imagePullPolicy: IfNotPresent
      # >>> the same projection the Part B scheduler patch adds to every plugin <<<
      envFrom:
        - configMapRef:
            name: wes-identity
            optional: true
      command: ["python3", "-c"]
      args:
        - |
          import os, json
          def _s(v, sent=("",)):
              if v is None: return None
              v=v.strip(); return None if v in sent else v
          def _c(v, lim):
              if v is None or v.strip()=="" : return None
              try: f=float(v)
              except: return None
              return f if abs(f)<=lim else None
          e=os.environ
          vsn=_s(e.get("WAGGLE_NODE_VSN"), ("","0"))
          ni={"vsn":vsn,"node_id":_s(e.get("WAGGLE_NODE_ID")),
              "lat":_c(e.get("WAGGLE_NODE_GPS_LAT"),90.0),
              "lon":_c(e.get("WAGGLE_NODE_GPS_LON"),180.0),
              "mobility":(_s(e.get("WAGGLE_NODE_MOBILITY")) or "unknown"),
              "vsn_is_placeholder": vsn is None}
          if ni["mobility"] not in ("static","mobile","unknown"): ni["mobility"]="unknown"
          print("=== pywaggle2 NodeInfo (from wes-identity ConfigMap) ===")
          print(json.dumps(ni, indent=2))
          print("=== raw WAGGLE_NODE_* env seen by the pod ===")
          for k in ("WAGGLE_NODE_ID","WAGGLE_NODE_VSN","WAGGLE_NODE_GPS_LAT","WAGGLE_NODE_GPS_LON","WAGGLE_NODE_MOBILITY"):
              print(f"  {k}={e.get(k, '<UNSET>')}")
      resources:
        requests: {cpu: "50m", memory: "32Mi"}
        limits: {memory: "64Mi"}
